security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Hiérarchie des rôles : tous les rôles métiers héritent de ROLE_USER
    # Les rôles d'attente (ROLE_ATTENTE_VERIFICATION et ROLE_ATTENTE) N'héritent PAS de ROLE_USER
    role_hierarchy:
        ROLE_ELEVE: ROLE_USER
        ROLE_MEDECIN: ROLE_USER
        ROLE_PARTENAIRE: ROLE_USER
        ROLE_GESTIONNAIRE: ROLE_USER
        ROLE_ADMIN: [ROLE_USER, ROLE_ELEVE, ROLE_MEDECIN, ROLE_PARTENAIRE, ROLE_GESTIONNAIRE]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\UserAuthenticator
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
            user_checker: App\Security\UserChecker

    access_control:
        # Pages publiques (accessibles sans connexion)
        - { path: ^/$, roles: PUBLIC_ACCESS }                      # Page d'accueil
        - { path: ^/login$, roles: PUBLIC_ACCESS }                 # Page de connexion
        - { path: ^/register, roles: PUBLIC_ACCESS }               # Inscription
        - { path: ^/verify/, roles: PUBLIC_ACCESS }                # Vérification d'email
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }         # Réinitialisation du mot de passe

        # Pages admin (réservées aux administrateurs)
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Pages pour utilisateurs en attente (uniquement ces pages)
        - { path: ^/verification$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/attente-verification$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/attente$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/logout$, roles: IS_AUTHENTICATED_FULLY }

        # Tout le reste nécessite ROLE_USER (les utilisateurs en attente n'ont PAS ce rôle)
        - { path: ^/, roles: ROLE_USER }
